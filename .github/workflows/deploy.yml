name: Deploy to GitHub Pages
on:
  push:
    branches: [master]

concurrency:
  group: deploy-master
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    env:
      ADOBE_CLIENT_ID: ${{ secrets.ADOBE_CLIENT_ID }}
      SITE_URL: https://covenantalbiblicist.unitedentropy.com
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            python3-pil python3-yaml python3-jinja2 python3-pikepdf
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build all articles
        run: ./build.sh
      - name: Run Pagefind
        run: npx pagefind --site _site/
      - name: Commit built artifacts
        run: |
          git config --global --add safe.directory /__w/covenantal_biblicist/covenantal_biblicist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Name any leftover dirty files before staging, so an unstaged build
          # output fails loudly here instead of surfacing later as the opaque
          # "cannot pull with rebase: You have unstaged changes" below.
          git status --porcelain
          git add articles/*/*.pdf articles/*/*.html index.html tags/ assets/og/ assets/fb/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: update built artifacts [skip ci]"
          git fetch origin master
          if ! git -c core.editor=true pull --rebase -X theirs origin master; then
            for f in $(git diff --name-only --diff-filter=U); do
              echo "Resolving conflict (keeping CI artifact): $f"
              git checkout --theirs -- "$f" && git add "$f"
            done
            git -c core.editor=true rebase --continue
          fi
          git push
      - uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
